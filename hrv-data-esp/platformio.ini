; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200

build_flags =
    ; Override the SparkFun library's I2C_BUFFER_LENGTH redefinition (32 bytes)
    ; back to the ESP32 Wire.h value (128 bytes). Without this the library reads
    ; only 5 samples per I2C transaction instead of 21, throttling throughput
    ; from 100Hz down to ~40Hz.
    -D I2C_BUFFER_LENGTH=128

lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.0